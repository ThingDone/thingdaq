[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
# This is the single authoritative distribution-name setting. The ``-local``
# suffix keeps this private build separate from the stable ``thingdaq`` import
# package. Review index availability before any public-package submission.
# Repository tooling never uploads a distribution.
name = "thingdaq-local"
dynamic = ["version"]
description = "Typed local Python API for ThingDAQ acquisition hardware"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.15"
dependencies = [
    "pyserial>=3.5",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.scripts]
thingdaq = "thingdaq.cli:main"
thingdaq-demo = "thingdaq.demo:main"
thingdaq-soak = "thingdaq.soak:main"

[project.optional-dependencies]
numpy = [
    "numpy>=1.24",
]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.8",
    "types-pyserial>=3.5",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "thingdaq._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["thingdaq", "thingdaq.*"]
namespaces = false

[tool.setuptools.package-data]
thingdaq = ["py.typed"]

[tool.setuptools.exclude-package-data]
"*" = [
    ".env",
    ".env.*",
    "*.bin",
    "*.csv",
    "*.elf",
    "*.hex",
    "*.json",
    "*.key",
    "*.map",
    "*.npy",
    "*.npz",
    "*.pem",
    "captures/*",
    "credentials/*",
]
