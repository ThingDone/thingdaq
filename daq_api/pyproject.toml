[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thingdone-daq"
dynamic = ["version"]
description = "Typed Python API for ThingDAQ acquisition hardware"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.15"
dependencies = [
    "pyserial>=3.5",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

authors = [{ name = "THING DONE LLC" }]
keywords = ["daq", "data-acquisition", "teensy", "adc", "gpio"]

[project.urls]
Documentation = "https://github.com/ThingDone/thingdaq/blob/main/doc/reference/api-reference.md"
Repository = "https://github.com/ThingDone/thingdaq"
Issues = "https://github.com/ThingDone/thingdaq/issues"
Changelog = "https://github.com/ThingDone/thingdaq/blob/main/daq_api/CHANGELOG.md"

[project.scripts]
"thingdone-daq" = "thingdone_daq.cli:main"
thingdone-daq-demo = "thingdone_daq.demo:main"
thingdone-daq-soak = "thingdone_daq.soak:main"

[project.optional-dependencies]
numpy = [
    "numpy>=1.24",
]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.8",
    "types-pyserial>=3.5",
    "twine>=6.1",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "thingdone_daq._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["thingdone_daq", "thingdone_daq.*"]
namespaces = false

[tool.setuptools.package-data]
thingdone_daq = ["py.typed"]

[tool.setuptools.exclude-package-data]
"*" = [
    ".env",
    ".env.*",
    "*.bin",
    "*.csv",
    "*.elf",
    "*.hex",
    "*.json",
    "*.key",
    "*.map",
    "*.npy",
    "*.npz",
    "*.pem",
    "captures/*",
    "credentials/*",
]
