[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# This distribution name is deliberately local and separate from the stable
# ``teensy_daq`` import package. Choose public metadata only after naming and
# publication review; this playbook never uploads a distribution.
name = "teensy-daq-local"
version = "0.0.0"
description = "Local-development Python API scaffold for Teensy DAQ"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
]
classifiers = [
    "Private :: Do Not Upload",
]

[project.scripts]
teensy-daq = "teensy_daq.cli:main"
teensy-daq-demo = "teensy_daq.demo:main"

[project.optional-dependencies]
numpy = [
    "numpy>=1.24",
]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.8",
    "types-pyserial>=3.5",
]

[tool.setuptools.packages.find]
where = ["src"]
